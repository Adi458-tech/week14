name: ci-wf
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Linting jobs
        run: echo "Starting Linting of HTML and CSS files"
      - name: Clone repo on runner
        uses: actions/checkout@v6
      - name: Install Dev Dependencies
        run: npm install
      - name: Lint html files
        run: npx htmlhint "**/*.html"
      - name: Lint css files
        run: npx stylelint "**/*.css"
    
  build-job:
    runs-on: ubuntu-latest
    needs: "linting-job"
    steps:
      - name: Build job
        run: echo "Build Job going to start"
      - name: clone repo
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm install
      - name: build web with parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache

  image-build-job:
    needs: "build-job"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo to build image
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: docker image build -t ${{ secrets.DOCKERHUB_USERNAME }}/app-latest
      - name: List imagaes on the runner
        run: docker image latest
      - name: Create container on the runner
        run: docker container run -d -p 2222:80 ${{ secrets.DOCKERHUB_USERNAME }}/app-latest
      - name: List running container
        run: docker container ls
      - name: Push docker image on the docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/app-latest

